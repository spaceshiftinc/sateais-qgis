name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR; never cancel runs on develop/main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.21
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # QGIS LTR 3.34 / 3.40 ship Python 3.9; test the floor and a current version.
        # PyQGIS-dependent tests skip themselves when qgis is not importable.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q

  # metadata.txt が宣言している対応範囲の両端で、実物の QGIS を使って回す。
  # 上の `test` は PyQGIS が無いので QGIS 依存のテストを全部 skip しており、
  # 300 件以上が CI では一度も実行されていなかった。その結果 Qt6 でしか
  # 起きない不具合（Qt.convertFromPlainText の削除）が利用者に届いた。
  # **対応を宣言するバージョンは、ここで動かして初めて宣言できる。**
  qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # qgisMinimumVersion = 3.34（Qt 5 / Python 3.12）
          - image: "qgis/qgis:3.34"
            label: "3.34 (Qt5)"
          # 現行の LTR
          - image: "qgis/qgis:3.40"
            label: "3.40 LTR (Qt5)"
          # qgisMaximumVersion 側。Qt 6 / Python 3.13
          - image: "qgis/qgis:4.0"
            label: "4.0 (Qt6)"
    name: qgis ${{ matrix.label }}
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: バージョンを記録する
        run: |
          python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR; import sys; print('QGIS', Qgis.QGIS_VERSION, '/ Qt', QT_VERSION_STR, '/ Python', sys.version.split()[0])"
      - run: pip install --break-system-packages pytest
      # test_geometry_adapter はコンテナの PROJ 構成に依存するため対象外
      - run: python3 -m pytest -q --ignore=sateais_qgis/tests/test_geometry_adapter.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/package.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit detect-secrets
      # Mirror the plugins.qgis.org blocking tier (its ZIP scan excludes tests/).
      - run: bandit -r sateais_qgis -x sateais_qgis/tests -q
      - run: |
          detect-secrets scan sateais_qgis --exclude-files 'tests/' > ds.json
          python -c "import json,sys; sys.exit(1 if json.load(open('ds.json'))['results'] else 0)"
