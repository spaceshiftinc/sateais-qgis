name: Bug report
description: Report a problem with the SateAIs for QGIS plugin
labels: [bug]
body:
  - type: input
    id: qgis-version
    attributes:
      label: QGIS version
      description: Help → About (e.g. 3.34.15, 3.40.2)
      placeholder: "3.40.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Plugins → Manage and Install Plugins → SateAIs API for QGIS
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        QGIS message log if any (View → Panels → Log Messages).
        Remove anything sensitive such as API keys.
      render: text
    validations:
      required: false
